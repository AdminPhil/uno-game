<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>UNO</h1>
    <p id="connection-status" role="status" aria-live="polite">Connecting…</p>
    <div id="lobby">
        <section id="round-result" hidden aria-labelledby="winner-message">
            <div class="winner-stars" aria-hidden="true">🎉 🏆 🎉</div>
            <h2 id="winner-message" role="status"></h2>
            <p>Play again in this lobby?</p>
            <button id="play-again" disabled>Yes, play again!</button>
            <button id="leave-after-round" disabled>No thanks, leave lobby</button>
            <p id="rematch-status" role="status"></p>
        </section>
        <h2>Join UNO Game</h2>
        <div>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div>
            <input type="text" id="lobby-id" placeholder="Lobby ID (leave empty for new lobby)">
        </div>
        <button id="join" disabled>Join Game</button>
        <div id="lobby-info" style="display: none;">
            <h3>Lobby: <span id="current-lobby-id"></span></h3>
            <p>Share this lobby ID with friends to join!</p>
            <button id="invite-telegram" disabled>Invite family on Telegram</button>
        </div>
        <ul id="players"></ul>
        <button id="ready" disabled>Ready</button>
        <p id="start-help" role="status"></p>
        <button id="start-game" hidden disabled>Start Game</button>
    </div>
    <div id="game" style="display: none;">
        <div id="turn-indicator">
            <h3 id="turn-text">Waiting for game to start...</h3>
        </div>
        <div id="opponent-hands"></div>
        <p id="discard-description" role="status" aria-live="polite"></p>
        <p id="draw-prompt" role="status" aria-live="polite"></p>
        <div id="center-area">
            <button id="draw-card">Draw Card</button>
            <div id="discard-pile"></div>
            <div id="wild-color-picker" style="display: none;">
                <h4>Choose a color:</h4>
                <div id="color-options">
                    <div class="color-option" data-color="red" style="background-color: red;"></div>
                    <div class="color-option" data-color="yellow" style="background-color: yellow;"></div>
                    <div class="color-option" data-color="green" style="background-color: green;"></div>
                    <div class="color-option" data-color="blue" style="background-color: blue;"></div>
                </div>
            </div>
        </div>
        <div id="player-hand"></div>
    </div>
    <script type="module" src="client.js"></script>
</body>
</html>
